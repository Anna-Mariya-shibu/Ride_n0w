<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - RideNow</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="brand">
            <img src="../assets/images/logo.png" alt="RideNow Logo">
            <span>RideNow</span>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="vehicles.html">Vehicles</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="form-page">

        <div class="form-card">

            <h1>Login</h1>

            <p class="muted">
                Demo login for the project.
            </p>


            <form id="loginForm">

                <label>
                    Email

                    <input
                        type="email"
                        required
                        placeholder="customer@example.com"
                    >
                </label>


                <label>
                    Password

                    <input
                        type="password"
                        required
                        placeholder="••••••••"
                    >
                </label>


                <label>
                    Role

                    <select id="role">
                        <option value="customer">
                            Customer
                        </option>

                        <option value="agency">
                            Rental Agency
                        </option>

                        <option value="admin">
                            Admin
                        </option>
                    </select>
                </label>


                <button
                    class="btn primary full"
                    type="submit"
                >
                    Login
                </button>

            </form>


            <p id="loginMessage"></p>

        </div>

    </main>


    <footer>
        © 2026 RideNow Vehicle Rental System
    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
